name: Verify published PowerShell Gallery installer
on:
  push:
    branches: [gallery-public-verification-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['16.9.3', '16.9.4']
    steps:
      - name: Install and import from public Gallery
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -ErrorAction Stop | Out-Null
          Install-Module -Name BrowserBox-Installer -RequiredVersion $env:PACKAGE_VERSION -Repository PSGallery -Scope CurrentUser -AcceptLicense -Force -ErrorAction Stop
          Import-Module BrowserBox-Installer -RequiredVersion $env:PACKAGE_VERSION -Force -ErrorAction Stop
          $module = Get-Module BrowserBox-Installer
          if ($module.Version -ne [version]$env:PACKAGE_VERSION) { throw 'Unexpected module version' }
          $command = Get-Command Install-BrowserBox -Module BrowserBox-Installer -ErrorAction Stop
          Write-Host "Installed and loaded $($module.Name) $($module.Version); command $($command.Name) resolves."
