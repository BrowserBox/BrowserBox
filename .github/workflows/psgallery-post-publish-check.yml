name: PowerShell Gallery verification
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version; leave blank for the Gallery default'
        type: string
        default: ''
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  gallery-install:
    name: Gallery install (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      WANT: ${{ inputs.version }}
    steps:
      - name: Resolve public version and prepare tools
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if ($PSVersionTable.PSEdition -eq 'Desktop') { Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null }
          $v = $env:WANT
          if (-not $v) { $v = (Find-Module BrowserBox-Installer -Repository PSGallery -ErrorAction Stop).Version.ToString() }
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Invalid Gallery version: $v" }
          "V=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Checking public Gallery version $v with $($PSVersionTable.PSVersion)"
      - name: Install-Module, import and resolve
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module BrowserBox-Installer -RequiredVersion $env:V -Repository PSGallery -Scope CurrentUser -AcceptLicense -Force
          Import-Module BrowserBox-Installer -RequiredVersion $env:V -Force
          Get-Command Install-BrowserBox -Module BrowserBox-Installer -ErrorAction Stop | Out-Null
      - name: Save-Module, import and resolve
        if: ${{ always() && env.V != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'saved'; New-Item -ItemType Directory $d -Force | Out-Null
          Save-Module BrowserBox-Installer -RequiredVersion $env:V -Repository PSGallery -Path $d -AcceptLicense -Force
          $manifest = Get-ChildItem $d -Recurse -Filter BrowserBox-Installer.psd1 | Select-Object -First 1
          if (-not $manifest) { throw 'Saved manifest missing' }
          Remove-Module BrowserBox-Installer -ErrorAction SilentlyContinue
          Import-Module $manifest.FullName -Force
          Get-Command Install-BrowserBox -Module BrowserBox-Installer -ErrorAction Stop | Out-Null
      - name: Install-PSResource, import and resolve
        if: ${{ always() && env.V != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -Repository PSGallery
            Import-Module Microsoft.PowerShell.PSResourceGet -Force
          }
          Install-PSResource -Name BrowserBox-Installer -Version $env:V -Repository PSGallery -Scope CurrentUser -TrustRepository -AcceptLicense -Reinstall
          Remove-Module BrowserBox-Installer -ErrorAction SilentlyContinue
          Import-Module BrowserBox-Installer -RequiredVersion $env:V -Force
          Get-Command Install-BrowserBox -Module BrowserBox-Installer -ErrorAction Stop | Out-Null
