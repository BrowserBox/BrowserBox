name: Qualify PowerShell Gallery installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE 'release-tests/psgallery/BrowserBox-Installer.16.9.4.nupkg'
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '961a84f06b654a5edf99348ba2915194ba816ae07210b355f1656540944dbc79') { throw "Candidate hash mismatch: $hash" }
          $source = Split-Path $package
          Register-PSRepository -Name Candidate -SourceLocation $source -InstallationPolicy Trusted
          Install-Module -Name BrowserBox-Installer -RequiredVersion 16.9.4 -Repository Candidate -Scope CurrentUser -AcceptLicense -Force -ErrorAction Stop
          Import-Module BrowserBox-Installer -RequiredVersion 16.9.4 -Force -ErrorAction Stop
          $module = Get-Module BrowserBox-Installer
          if ($module.Version -ne [version]'16.9.4') { throw 'Unexpected installed module version' }
          $command = Get-Command Install-BrowserBox -Module BrowserBox-Installer -ErrorAction Stop
          if (-not $command) { throw 'Install-BrowserBox did not resolve' }
          Write-Host "Installed and loaded $($module.Name) $($module.Version); command $($command.Name) resolves."
